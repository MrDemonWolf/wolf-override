name: Game checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Get pinned Godot 4.7.2
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot.zip"
          printf '%s  %s\n' cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4 "$RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          godot_bin="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$godot_bin"
          "$godot_bin" --version
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
      - name: Import game
        # A fresh clone's first import loads the project theme before its fonts are imported and
        # prints ordering errors; the second import must be clean.
        run: |
          "$GODOT_BIN" --headless --path apps/game --import > "$RUNNER_TEMP/wolf-check-import-first.log" 2>&1
          "$GODOT_BIN" --headless --path apps/game --import 2>&1 | tee "$RUNNER_TEMP/wolf-check-import.log"
          if grep -q 'ERROR' "$RUNNER_TEMP/wolf-check-import.log"; then
            echo "Second import reported errors" >&2
            exit 1
          fi
      - name: Check M0 state
        run: '"$GODOT_BIN" --headless --path apps/game --script res://tests/m0_state_test.gd 2>&1 | tee "$RUNNER_TEMP/wolf-check-state.log"'
      - name: Check M0 scene
        run: '"$GODOT_BIN" --headless --path apps/game --script res://tests/m0_scene_test.gd 2>&1 | tee "$RUNNER_TEMP/wolf-check-corridor.log"'
      - name: Check first chapter scene
        run: '"$GODOT_BIN" --headless --path apps/game --script res://tests/chapter_scene_test.gd 2>&1 | tee "$RUNNER_TEMP/wolf-check-chapter.log"'
      - name: Check UI and controls
        run: '"$GODOT_BIN" --headless --path apps/game --script res://tests/ui_controls_test.gd 2>&1 | tee "$RUNNER_TEMP/wolf-check-controls.log"'
      - name: Check settings persistence and rebinding
        run: '"$GODOT_BIN" --headless --path apps/game --script res://tests/settings_test.gd 2>&1 | tee "$RUNNER_TEMP/wolf-check-settings.log"'
      - name: Preserve failed check logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: game-check-failure-logs
          path: ${{ runner.temp }}/wolf-check-*.log
          if-no-files-found: ignore
          retention-days: 7
