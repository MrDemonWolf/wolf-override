name: Game checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; every push to main is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history on pull requests, so the copy check can find the merge base;
          # one commit otherwise. (1 comes first: 0 is falsy in an expression.)
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
      - name: Check for copied code
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check-copies.py --base "origin/$BASE_REF"
      - name: Get pinned Godot 4.7.2
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot.zip"
          printf '%s  %s\n' cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4 "$RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          godot_bin="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$godot_bin"
          "$godot_bin" --version
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
      - name: Import and run headless checks
        timeout-minutes: 10
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/wolf-check-logs
        run: scripts/check-game.sh
      # The committed translation template must be what Godot's own generator makes from this commit, so
      # a text change cannot reach main without its msgids (scripts/i18n/extract_pot.sh; localization PR L2).
      # It reuses the import check-game.sh just made and only starts the editor headless (a few seconds).
      - name: Translation template is fresh
        timeout-minutes: 5
        run: |
          scripts/i18n/extract_pot.sh . "$RUNNER_TEMP/i18n/messages.pot" "$RUNNER_TEMP/wolf-check-logs/i18n-pot"
          if ! diff -u i18n/messages.pot "$RUNNER_TEMP/i18n/messages.pot"; then
            echo "i18n/messages.pot is out of date: run scripts/i18n/extract_pot.sh . i18n/messages.pot <log dir> and commit the result" >&2
            exit 1
          fi
      - name: Preserve failed check logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: game-check-failure-logs
          path: ${{ runner.temp }}/wolf-check-logs/
          if-no-files-found: ignore
          retention-days: 7

  # The translation gates that need no Godot (scripts/i18n/i18n_tool.py; localization PR L2). Every step
  # fails the job on a non-zero exit: the tool exits 1 on any failed gate.
  i18n:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get gettext (msgfmt)
        run: |
          command -v msgfmt || { sudo apt-get update -q && sudo apt-get install -y -q gettext; }
          msgfmt --version | head -1
      - name: Gates catch their planted errors
        run: python3 -I -B scripts/i18n/i18n_tool.py selftest "$RUNNER_TEMP/i18n-selftest.json"
      - name: Glossary and style guides are sound
        run: python3 -I -B scripts/i18n/i18n_tool.py glossary
      - name: Every scene and script is in the POT file list
        run: python3 -I -B scripts/i18n/i18n_tool.py potfiles apps/game --check
      - name: Translations pass every gate
        run: python3 -I -B scripts/i18n/i18n_tool.py check i18n/messages.pot apps/game/i18n "$RUNNER_TEMP/i18n-check.json"
