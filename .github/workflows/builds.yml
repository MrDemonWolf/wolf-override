name: Test builds

# Unsigned debug builds of the game for macOS and Windows, for testing while the game is in development.
# They are not releases. The repository is public, so anyone signed in to GitHub can download them
# until they expire. This job is deliberately not a required check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older build; every push to main keeps its own build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  export-test-builds:
    # Pull requests from forks get no downloadable builds: they would be executables built from unreviewed code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # Build the pushed commit itself (not a pull request's merge preview), so the name matches the code.
      BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_COMMIT }}
          persist-credentials: false
      - name: Get pinned Godot 4.7.2
        run: |
          scripts/get-godot.sh "$RUNNER_TEMP/godot"
          {
            echo "GODOT_HOME=$RUNNER_TEMP/godot-home"
            echo "BUILD_DIR=$RUNNER_TEMP/test-builds"
            echo "SHORT_SHA=${BUILD_COMMIT:0:7}"
          } >> "$GITHUB_ENV"
      # Only the five template files these presets use are kept (about 165 MB cached, from a 1.28 GB archive);
      # v2 of the key adds icudt_godot.dat, so a cache saved before it is not restored.
      # Pushes to main save the cache that pull requests then restore; the files are checked against
      # pinned SHA-256 sums on every run, cached or not.
      - name: Restore Godot export templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/godot-home/.local/share/godot/export_templates/4.7.2.stable
          key: godot-export-templates-4.7.2-ca4d71c4-macos-win64-debug-v2
      - name: Get Godot export templates
        run: scripts/get-export-templates.sh "$GODOT_HOME"
      - name: Export and package the macOS and Windows debug builds
        timeout-minutes: 20
        run: scripts/export-game.sh "$BUILD_DIR"
      - name: Upload the macOS build
        id: macos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.BUILD_DIR }}/wolf-override-macos-debug-${{ env.SHORT_SHA }}.zip
          archive: false
          retention-days: 14
          if-no-files-found: error
          overwrite: true
      - name: Upload the Windows build
        id: windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.BUILD_DIR }}/wolf-override-windows-debug-${{ env.SHORT_SHA }}.zip
          archive: false
          retention-days: 14
          if-no-files-found: error
          overwrite: true
      - name: Say where the builds are and how to open them
        env:
          MACOS_URL: ${{ steps.macos.outputs.artifact-url }}
          WINDOWS_URL: ${{ steps.windows.outputs.artifact-url }}
        run: |
          size() { du -m "$BUILD_DIR/$1" | cut -f1; }
          macos="wolf-override-macos-debug-$SHORT_SHA.zip"
          windows="wolf-override-windows-debug-$SHORT_SHA.zip"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Test builds for commit \`$SHORT_SHA\`

          Unsigned **debug** builds with the debug tools on, for testing. They are not releases and nobody has played them by hand as part of this run. They expire after **14 days**. Sign in to GitHub to download; because the repository is public, anyone signed in can.

          | Platform | Download | Size |
          | --- | --- | --- |
          | macOS (Apple silicon and Intel) | [$macos]($MACOS_URL) | $(size "$macos") MB |
          | Windows (64-bit) | [$windows]($WINDOWS_URL) | $(size "$windows") MB |

          **macOS:** unzip and open \`WOLF OVERRIDE.app\`. When macOS says it cannot check the app, click **Done**, then open **System Settings → Privacy & Security** and click **Open Anyway** (it is offered for about an hour), and confirm with your password. Or, in Terminal, run \`xattr -dr com.apple.quarantine "WOLF OVERRIDE.app"\` in the unzipped folder.

          **Windows:** right-click the zip, choose **Extract All**, then run \`WOLF-OVERRIDE.exe\`. At "Windows protected your PC", click **More info**, then **Run anyway**. \`WOLF-OVERRIDE.console.exe\` runs the same build with its log in a console window. If Smart App Control is on, Windows blocks unsigned builds and there is no way to allow this one.

          Licence notices are in the \`licenses\` folder in each zip. Full steps: [Install a test build](https://wolfoverride.mrdemonwolf.dev/docs/test-builds/).
          EOF
      - name: Preserve export logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-build-logs
          path: ${{ env.BUILD_DIR }}/logs/
          if-no-files-found: ignore
          retention-days: 7
