# GitHub issue form for reporting a mistake in one of WOLF OVERRIDE's
# machine translations. Players reach it from the website's Support page
# (apps/docs/content/docs/support.mdx, "Report a translation mistake").
#
# The language list must match the languages the game offers. The one home
# for that list is the Languages table on apps/docs/content/docs/platforms.mdx;
# when a language is added or removed there, change the dropdown below too.
# English is left out on purpose: it is the source text, so an English mistake
# is an ordinary bug report, not a translation issue.
name: Translation issue
description: Report wrong, unclear or cut-off text in one of the game's translations.
title: "[Translation] "
# "bug" is an existing repository label; there is no translation label yet.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Every language except English is a machine translation that no native speaker has reviewed yet, so your report helps a lot.

        Keep personal details out, and please do not post story spoilers beyond the line you are reporting.
  - type: dropdown
    id: language
    attributes:
      label: Language
      description: The language chosen under LANGUAGE in Settings.
      options:
        - Deutsch
        - Español (Latinoamérica)
        - Español (España)
        - Français
        - Polski
        - Português (Brasil)
        - Русский
        - 日本語
        - 한국어
        - 简体中文
        - 繁體中文
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the game
      description: The screen or room, such as the title, Settings, Pause, the credits or a room's name.
      placeholder: "Settings, the TEXT SIZE row"
    validations:
      required: true
  - type: textarea
    id: shown
    attributes:
      label: Text shown
      description: Copy the text exactly as the game shows it.
    validations:
      required: true
  - type: textarea
    id: should-say
    attributes:
      label: What it should say
      description: Your suggested text, and why if it helps. Say so if the text is cut off or does not fit.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag an image here. An F12 bug capture works too.
    validations:
      required: false
